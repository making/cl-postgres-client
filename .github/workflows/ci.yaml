name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. SBCL is the reference implementation; CCL and ECL are here because
  # Quicklisp is a home for portable libraries, and a suite that only ever runs
  # on SBCL is how an implementation-specific assumption gets in unnoticed.
  lisp:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SBCL
            lisp: sbcl
          - name: CCL
            lisp: ccl
          - name: ECL
            lisp: ecl
    steps:
      - uses: actions/checkout@v7

      # CCL has no distribution package. Its release tarball carries the binary
      # next to the heap image it needs, and CCL resolves the symlink before
      # looking for that image, so one link into PATH is the whole install.
      - name: Install ${{ matrix.name }}
        env:
          CCL_URL: https://github.com/Clozure/ccl/releases/download/v1.13/ccl-1.13-linuxx86.tar.gz
        run: |
          if [ "${{ matrix.lisp }}" = ccl ]; then
            curl -sSL "$CCL_URL" | sudo tar xz -C /opt
            sudo ln -s /opt/ccl/lx86cl64 /usr/local/bin/ccl
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ${{ matrix.lisp }}
          fi
          ${{ matrix.lisp }} --version

      # `make deps` is a file target, so a restored cache skips both the
      # Quicklisp bootstrap and the cl-postgres / rove downloads under it.
      # ASDF's output cache rides along because ECL compiles through a C
      # compiler and rebuilding its dependencies from scratch costs more than
      # the run itself; the checkout is younger than anything restored here, so
      # this library's own files still recompile every time.
      #
      # Each implementation keeps its own key. The contents would be shareable,
      # but three jobs saving one key is a race whose losers report a failure
      # for work that succeeded.
      - name: Cache the project-local Quicklisp
        uses: actions/cache@v6
        with:
          path: |
            .quicklisp
            ~/.cache/common-lisp
          key: quicklisp-${{ runner.os }}-${{ matrix.lisp }}-${{ hashFiles('cl-postgres-client.asd') }}
          restore-keys: quicklisp-${{ runner.os }}-${{ matrix.lisp }}-

      - name: Run the suite
        run: make test LISP=${{ matrix.lisp }}

      - name: PostgreSQL log
        if: failure()
        run: docker compose logs postgres

  # Also a gate. The same sources run on rontolisp's three backends and the
  # suite is green on all of them, so a failure here is news either way: a
  # portability regression in this library, or one in rontolisp, which is a
  # SNAPSHOT dependency. Both are worth stopping for.
  rontolisp:
    name: rontolisp (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: interpreter
            target: rontolisp-test
          - backend: jvm
            target: rontolisp-test-jvm
          - backend: wasm-component
            target: rontolisp-test-wasm
    steps:
      - uses: actions/checkout@v7

      - name: Install rontolisp
        run: |
          sudo curl -sSLo /usr/local/bin/rontolisp \
            https://github.com/making/rontolisp/releases/download/0.1.0-SNAPSHOT/rontolisp-linux-amd64
          sudo chmod +x /usr/local/bin/rontolisp
          rontolisp --version

      # The compiled run needs a JVM to execute the emitted class; the component
      # needs a wasm-GC runtime with exception handling.
      - name: Install a JVM
        if: matrix.backend == 'jvm'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install wasmtime
        if: matrix.backend == 'wasm-component'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "v47.0.3"

      # rontolisp's ASDF does not fall back to Quicklisp for a missing
      # dependency, so `make rontolisp-deps` fills this cache and the Makefile
      # names every release directory in it on --system-path.
      - name: Cache rontolisp's Quicklisp
        uses: actions/cache@v6
        with:
          path: ~/.rontolisp/quicklisp
          key: rontolisp-quicklisp-${{ runner.os }}-${{ hashFiles('cl-postgres-client.asd') }}
          restore-keys: rontolisp-quicklisp-${{ runner.os }}-

      # `tee` would otherwise hide a failing suite behind its own exit status.
      - name: Run the suite
        id: run
        run: |
          set -o pipefail
          make ${{ matrix.target }} 2>&1 | tee run.log

      - name: Report the counts
        if: always()
        run: |
          passed=$(grep -ac '✓' run.log || true)
          failed=$(grep -acE '^[[:space:]]+×' run.log || true)
          {
            echo "### rontolisp ${{ matrix.backend }}"
            echo
            echo "| passed | failed | exit |"
            echo "| --- | --- | --- |"
            echo "| $passed | $failed | ${{ steps.run.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the run log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rontolisp-${{ matrix.backend }}-log
          path: run.log
