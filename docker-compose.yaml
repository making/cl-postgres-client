# PostgreSQL instance used by the test suite.
#
# Port 55432 is deliberately not 5432: the suite must not collide with -- or
# silently run against -- a PostgreSQL the developer already has running.
#
# The host authentication method is md5 rather than the modern default of
# scram-sha-256.  Nothing in the suite tests authentication, and SCRAM costs
# 4096 rounds of PBKDF2-HMAC-SHA256 per connection -- roughly half a minute per
# test on an interpreted Lisp, where every one of them opens its own connection.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pgc_test
      POSTGRES_USER: pgc
      POSTGRES_PASSWORD: pgc
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pgc -d pgc_test"]
      interval: 1s
      timeout: 3s
      retries: 30
